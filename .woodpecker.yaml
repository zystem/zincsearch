variables:
  - &go_image golang:1.26
  - &buildx_image woodpeckerci/plugin-docker-buildx:5.2.0
  - &image_settings
    registry: ghcr.io
    repo: ghcr.io/${CI_REPO}-coordinator
    dockerfile: docker/Dockerfile.coordinator
    context: .

steps:
  build:
    image: *go_image
    environment:
      ZINC_FIRST_ADMIN_USER: admin
      ZINC_FIRST_ADMIN_PASSWORD: Complexpass#123
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      # The UI is embedded at build time; tests do not need the real one.
      - mkdir -p frontend/dist && touch frontend/dist/index.html
      - go vet ./pkg/... ./cmd/...
      - go test -p 1 ./pkg/streaming/... ./pkg/coordinator/... ./pkg/backup/... ./pkg/core/... ./pkg/metadata/... ./pkg/handlers/...
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build/amd64/zincsearch ./cmd/zincsearch
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build/amd64/zinccoordinator ./cmd/zinccoordinator
    when:
      - event: push
        branch: main
      - event: pull_request
      - event: tag

  package_release:
    image: golang:1.26
    commands:
      - mkdir -p dist
      - |
        set -e
        mkdir -p frontend/dist && touch frontend/dist/index.html
        for arch in amd64 arm64; do
          out=build/$arch
          mkdir -p $out
          for cmd in zincsearch zinccoordinator; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o $out/$cmd ./cmd/$cmd
          done
          tar -C $out -czf dist/zincsearch-coordinator-linux-$arch.tar.gz zincsearch zinccoordinator
          (cd dist && sha256sum zincsearch-coordinator-linux-$arch.tar.gz > zincsearch-coordinator-linux-$arch.tar.gz.sha256)
        done
    depends_on:
      - build
    when:
      - event: tag
        ref: refs/tags/v*

  # Pull requests only build the image; nothing is pushed.
  check_image:
    image: *buildx_image
    settings:
      <<: *image_settings
      dry_run: true
      platforms: linux/amd64
    depends_on:
      - build
    when:
      - event: pull_request

  publish_image_main:
    image: *buildx_image
    settings:
      <<: *image_settings
      username: ${CI_REPO_OWNER}
      password:
        from_secret: ghcr_token
      platforms:
        - linux/amd64
        - linux/arm64
      tags:
        - main
    depends_on:
      - build
    when:
      - event: push
        branch: main

  publish_image:
    image: *buildx_image
    settings:
      <<: *image_settings
      username: ${CI_REPO_OWNER}
      password:
        from_secret: ghcr_token
      platforms:
        - linux/amd64
        - linux/arm64
      build_args:
        - VERSION=${CI_COMMIT_TAG##v}
      tags:
        - ${CI_COMMIT_TAG##v}
        - ${CI_COMMIT_TAG}
        - latest
    depends_on:
      - build
    when:
      - event: tag
        ref: refs/tags/v*

  publish_release:
    image: woodpeckerci/plugin-release:0.3.1
    settings:
      api-key:
        from_secret: github_token
      files:
        - dist/*
      file-exists: overwrite
      generate-release-notes: true
      title: ${CI_COMMIT_TAG}
    depends_on:
      - package_release
      - publish_image
    when:
      - event: tag
        ref: refs/tags/v*
